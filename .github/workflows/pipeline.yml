name: PitchPerfect CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# ============================================================
# JOB 1 — Frontend: Lint, Type-check, Test
# ============================================================
jobs:
  frontend:
    name: "Frontend – Lint, Type-check, Test"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Lint (next lint)
        run: npm run lint

      # No "test" script in package.json — skip vitest/jest invocation
      # Uncomment when a test script is added:
      # - name: Run tests
      #   run: npm test -- --passWithNoTests

  # ============================================================
  # JOB 2 — Backend: Lint, Type-check, Test + Coverage
  # ============================================================
  backend:
    name: "Backend – Lint, Type-check, Test"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run pytest with coverage
        run: |
          cd backend
          python -m pytest \
            --tb=short \
            -q \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Print coverage summary
        if: always()
        run: |
          echo "## 🧪 Backend Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cd backend && python -m coverage report --skip-covered 2>/dev/null || echo "(coverage data unavailable)"
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 14

  # ============================================================
  # JOB 3 — Build → Push → Deploy
  # ============================================================
  build-and-deploy:
    name: "Build → Push → Deploy"
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build -t pitchperfect-backend ./backend

      - name: Deploy (placeholder)
        run: |
          echo "Deploy step placeholder — configure SSH deploy target when ready"
