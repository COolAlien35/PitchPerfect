---
# PitchPerfect – Production Docker Compose
# Deploy:  docker compose -f docker-compose.prod.yml up -d
# Secrets: populate .env.prod (excluded from VCS) before deploying
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

x-restart: &always-restart
  restart: always

services:

  # ----------------------------------------------------------------
  # PostgreSQL
  # ----------------------------------------------------------------
  db:
    image: postgres:16-alpine
    <<: *always-restart
    logging: *default-logging
    volumes:
      - pg_data:/var/lib/postgresql/data
    env_file: .env.prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
    networks:
      - pitchperfect_internal

  # ----------------------------------------------------------------
  # Redis
  # ----------------------------------------------------------------
  redis:
    image: redis:7-alpine
    <<: *always-restart
    logging: *default-logging
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD}
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --save ""
        --appendonly no
    volumes:
      - redis_data:/data
    env_file: .env.prod
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "384M"
    networks:
      - pitchperfect_internal

  # ----------------------------------------------------------------
  # FastAPI Backend
  # ----------------------------------------------------------------
  app:
    image: ghcr.io/${GITHUB_REPOSITORY}/backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
    <<: *always-restart
    logging: *default-logging
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-fs", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "1G"
      replicas: 1
    networks:
      - pitchperfect_internal
      - pitchperfect_external

  # ----------------------------------------------------------------
  # Next.js Frontend
  # ----------------------------------------------------------------
  web:
    image: ghcr.io/${GITHUB_REPOSITORY}/frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
    <<: *always-restart
    logging: *default-logging
    env_file: .env.prod
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
    ports:
      - "3000:3000"
    networks:
      - pitchperfect_external

  # ----------------------------------------------------------------
  # Nginx reverse-proxy (TLS termination + routing)
  # ----------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    <<: *always-restart
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web
      - app
    networks:
      - pitchperfect_external
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "128M"

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local

networks:
  pitchperfect_internal:
    driver: bridge
    internal: true # DB and Redis are NOT internet-reachable
  pitchperfect_external:
    driver: bridge
