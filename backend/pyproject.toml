[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths   = ["tests"]
addopts     = """
    -x
    --tb=short
    --strict-markers
    -q
"""

[tool.coverage.run]
source  = ["app"]
omit    = ["tests/*", "app/main.py"]

[tool.coverage.report]
show_missing = true
fail_under   = 60
